name: "🚀 Build & Publish Docker"

on:
  push:
    branches:
      - main
      - dev
    paths:
      - ".github/workflows/**"
      - "ubuntu-gnome/**"
  workflow_dispatch:

concurrency:
  group: publish-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-docker:
    name: "🐳 Build Ubuntu ${{ matrix.ubuntu_version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu_version: "20.04"
            tag: "2004"
          - ubuntu_version: "24.04"
            tag: "2404"
          - ubuntu_version: "26.04"
            tag: "2604"

    steps:
      - name: "📂 拉取源码"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "🛠️ 设置 QEMU (支持多平台构建)"
        uses: docker/setup-qemu-action@v3

      - name: "🏗️ 设置 Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "🔑 登录到 DockerHub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: "📤 构建并推送 Docker 镜像 (${{ matrix.tag }})"
        run: |
          USERNAME=$(echo "${{ secrets.DOCKERHUB_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${USERNAME}/ubuntu-gnome-vnc:${{ matrix.tag }}"
          echo "🚀 正在构建并推送镜像: $IMAGE (Ubuntu ${{ matrix.ubuntu_version }})"
          docker buildx build \
            --platform linux/amd64 \
            --build-arg UBUNTU_VERSION=${{ matrix.ubuntu_version }} \
            --cache-from=type=gha,scope=${{ matrix.tag }} \
            --cache-to=type=gha,mode=max,scope=${{ matrix.tag }} \
            -t "$IMAGE" \
            --push ./ubuntu-gnome
